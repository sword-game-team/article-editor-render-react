<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Article Content Renderer</title>
  <desc id="desc">A diagram showing protocol JSON flowing through validation into semantic React output.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3fc" />
      <stop offset="1" stop-color="#f7f9fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#32506b" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="960" height="360" rx="24" fill="url(#background)" />
  <g filter="url(#shadow)">
    <rect x="70" y="80" width="220" height="200" rx="18" fill="#17212f" />
    <rect x="370" y="80" width="220" height="200" rx="18" fill="#ffffff" />
    <rect x="670" y="80" width="220" height="200" rx="18" fill="#1769aa" />
  </g>
  <g fill="none" stroke="#7793aa" stroke-width="4" stroke-linecap="round">
    <path d="M310 180h40" />
    <path d="m340 165 15 15-15 15" />
    <path d="M610 180h40" />
    <path d="m640 165 15 15-15 15" />
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="180" y="130" fill="#7cc4ff" font-size="15" font-weight="700">PROSEMIRROR</text>
    <text x="180" y="170" fill="#ffffff" font-size="27" font-weight="700">JSON</text>
    <text x="180" y="207" fill="#aebdca" font-size="14">nodes · attrs · marks</text>
    <text x="180" y="240" fill="#aebdca" font-size="14">protocol v1</text>
    <text x="480" y="130" fill="#1769aa" font-size="15" font-weight="700">REACT COMPONENT</text>
    <text x="480" y="170" fill="#17212f" font-size="27" font-weight="700">Validate</text>
    <text x="480" y="207" fill="#607386" font-size="14">safe URLs · defaults</text>
    <text x="480" y="240" fill="#607386" font-size="14">recursive elements</text>
    <text x="780" y="130" fill="#bfe3ff" font-size="15" font-weight="700">SEMANTIC OUTPUT</text>
    <text x="780" y="170" fill="#ffffff" font-size="27" font-weight="700">HTML</text>
    <text x="780" y="207" fill="#d8edfd" font-size="14">accessible · themed</text>
    <text x="780" y="240" fill="#d8edfd" font-size="14">application links</text>
  </g>
</svg>
